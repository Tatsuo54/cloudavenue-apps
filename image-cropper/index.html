<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Image Cropper</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style id="cloudavenue-shared-css">
    /* --- Base Styles & Theme --- */
    :root {
      --bg: #E8F0F8;
      --surface: #FFFFFF;
      --surface2: #DCE4EE;
      --border: #B8C5D6;
      --text: #4A5568;
      --text-dim: #718096;
      --accent: #829DB0;
      --accent-dim: #A2B5C9;
      --primary: #6B8EAD;
      --primary-hover: #567691;
      --hover-bg: #F0F7FF;
      --sans-font: 'Roboto', 'Noto Sans JP', sans-serif;
      --mono-font: 'JetBrains Mono', 'SF Mono', monospace;
      --shadow-sm: 0 4px 12px rgba(130,157,176,0.12);
      --shadow-md: 0 8px 24px rgba(130,157,176,0.18);
      
      /* Context Specific mappings */
      --info-bg: #d1e0e3; /* Dull cyan for info */
      --info-text: #2b5a61;
      --warn-bg: #eedbd0; /* Dull orange for warning */
      --warn-text: #7a4a31;
      --success-bg: #cfdfd5; /* Dull green for success */
      --success-text: #3e5e49;
    }

    [data-theme="dark"] {
      --bg: #1a202c;
      --surface: #2d3748;
      --surface2: #4a5568;
      --border: #718096;
      --text: #e2e8f0;
      --text-dim: #a0aec0;
      --accent: #829DB0;
      --accent-dim: #627A8A;
      --primary: #6B8EAD;
      --primary-hover: #829DB0;
      --hover-bg: #2d3748;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.5);

      --info-bg: #2b5a61;
      --info-text: #d1e0e3;
      --warn-bg: #4a2e1d;
      --warn-text: #eedbd0;
      --success-bg: #2b3d31;
      --success-text: #cfdfd5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans-font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Language Toggle CSS --- */
    html[lang="ja"] [lang="en"] { display: none !important; }
    html[lang="en"] [lang="ja"] { display: none !important; }

    /* --- Layout & Utilities --- */
    .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; flex: 1; position: relative; }
    h1.page-title { display: block; }
    .hidden { display: none !important; }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--text); }

    /* --- Top Nav (Header) --- */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-left { display: flex; align-items: center; justify-content: flex-start; gap: 15px; margin-right: auto; }
    .back-link {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: var(--text); }

    /* --- Toggles (Select) --- */
    .ctrl-select {
      font-family: var(--sans-font);
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .ctrl-select:focus { border-color: var(--accent); }

    /* --- Page Title --- */
    .page-title {
      font-size: 42px; font-weight: 700; color: var(--primary);
      letter-spacing: -0.01em; margin-bottom: 32px; text-align: center;
    }



    /* --- Form Controls & Buttons --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--sans-font);
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-primary:disabled { background: var(--border); border-color: var(--border); cursor: not-allowed; transform: none; }
    
    .btn-secondary { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
    .btn-secondary:hover { background: var(--hover-bg); border-color: var(--accent); }

    .btn-container { display: flex; gap: 15px; flex-wrap: wrap; }

    /* --- Footer --- */
    .main-footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: auto;
      font-size: 14px;
      color: var(--text-dim);
    }

    /* --- App Specific Styles --- */
    .drop-zone {
      border: 3px dashed var(--border);
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--bg);
    }
    .drop-zone p { margin: 0; color: var(--text-dim); }
    
    .controls {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .control-section { margin-bottom: 20px; }
    .control-section:last-child { margin-bottom: 0; }
    .section-title {
      font-weight: bold;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .control-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .control-row:last-child { margin-bottom: 0; }
    .control-row label { width: 100px; font-weight: bold; color: var(--text); font-size: 13px;}
    
    .control-row input[type="range"] {
      flex: 1; height: 8px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 4px; outline: none;
    }
    .control-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    .control-row input[type="number"] {
      width: 80px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text);
    }
    
    .info {
      background: var(--info-bg); padding: 10px 15px; border-radius: 8px; font-size: 14px; color: var(--info-text);
    }
    .file-count {
      background: var(--warn-bg); padding: 10px 15px; border-radius: 8px; font-size: 14px; color: var(--warn-text); margin-bottom: 15px; font-weight: bold;
    }
    
    .unit-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
    .unit-btn {
      padding: 8px 20px; border: 2px solid var(--border); background: var(--surface); border-radius: 100px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; color: var(--text-dim);
    }
    .unit-btn:hover { border-color: var(--accent-dim); color: var(--text); }
    .unit-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .preview-container {
      background: var(--surface); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; border: 1px solid var(--border);
    }
    .preview-label { font-weight: bold; margin-bottom: 15px; color: var(--text); font-size: 14px;}
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .preview-grid.single-image { grid-template-columns: 1fr; max-width: 800px; margin: 0 auto; }
    .preview-grid.single-image .preview-wrapper img { max-height: none; }
    
    .preview-item { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid var(--border);}
    .preview-item-name { font-size: 12px; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold;}
    .preview-item-size { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-family: var(--mono-font);}
    
    .preview-wrapper { position: relative; display: inline-block; max-width: 100%; }
    .preview-wrapper img { max-width: 100%; max-height: 200px; display: block; margin: 0 auto; border-radius: 4px;}
    .crop-overlay { position: absolute; background: rgba(0, 0, 0, 0.6); pointer-events: none; }
    .crop-overlay-top { top: 0; left: 0; right: 0; }
    .crop-overlay-bottom { bottom: 0; left: 0; right: 0; }
    .crop-overlay-left { left: 0; top: 0; bottom: 0; }
    .crop-overlay-right { right: 0; top: 0; bottom: 0; }
    
    canvas { display: none; }
    .progress { margin-top: 15px; padding: 10px 15px; background: var(--success-bg); border-radius: 8px; color: var(--success-text); font-size: 14px; font-weight: bold;}
  </style>
</head>
<body>

  <!-- Shared Navigation Template -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span lang="ja">トップに戻る</span><span lang="en">Back to Top</span>
      </a>
    </div>
    <div class="nav-right">
      <select id="theme-select" class="ctrl-select">
        <option value="light" lang="ja">ライト</option><option value="light" lang="en">Light</option>
        <option value="dark" lang="ja">ダーク</option><option value="dark" lang="en">Dark</option>
        <option value="system" lang="ja">システム</option><option value="system" lang="en">System</option>
      </select>
      <select id="lang-select" class="ctrl-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">
      <span lang="ja">画像一括トリミングツール</span><span lang="en">Batch Image Cropper</span>
    </h1>
    
    <div class="drop-zone" id="dropZone">
      <p>
        <span lang="ja">複数の画像をドラッグ&ドロップ<br>またはクリックして選択</span>
        <span lang="en">Drag & drop multiple images<br>or click to select</span>
      </p>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>
    
    <div class="controls hidden" id="controls">
      <div class="file-count" id="fileCount">
        <span lang="ja">読み込んだファイル: 0件</span>
        <span lang="en">Loaded files: 0</span>
      </div>
      <div class="unit-toggle">
        <button class="unit-btn active" id="unitPx">px</button>
        <button class="unit-btn" id="unitPercent">%</button>
      </div>
      
      <div class="control-section">
        <div class="section-title">
          <span lang="ja">上下トリミング</span>
          <span lang="en">Vertical Cropping</span>
        </div>
        <div class="control-row">
          <label>
            <span lang="ja">上から</span>
            <span lang="en">From Top</span>
          </label>
          <input type="range" id="topCut" min="0" max="300" value="0">
          <input type="number" id="topCutNum" min="0" max="1000" value="0" step="1"> <span class="unit-label">px</span>
        </div>
        <div class="control-row">
          <label>
            <span lang="ja">下から</span>
            <span lang="en">From Bottom</span>
          </label>
          <input type="range" id="bottomCut" min="0" max="300" value="0">
          <input type="number" id="bottomCutNum" min="0" max="1000" value="0" step="1"> <span class="unit-label">px</span>
        </div>
      </div>
      
      <div class="control-section">
        <div class="section-title">
          <span lang="ja">左右トリミング</span>
          <span lang="en">Horizontal Cropping</span>
        </div>
        <div class="control-row">
          <label>
            <span lang="ja">左から</span>
            <span lang="en">From Left</span>
          </label>
          <input type="range" id="leftCut" min="0" max="300" value="0">
          <input type="number" id="leftCutNum" min="0" max="1000" value="0" step="1"> <span class="unit-label">px</span>
        </div>
        <div class="control-row">
          <label>
            <span lang="ja">右から</span>
            <span lang="en">From Right</span>
          </label>
          <input type="range" id="rightCut" min="0" max="300" value="0">
          <input type="number" id="rightCutNum" min="0" max="1000" value="0" step="1"> <span class="unit-label">px</span>
        </div>
      </div>
    </div>
    
    <div class="preview-container hidden" id="previewContainer">
      <div class="preview-label">
        <span lang="ja">プレビュー（暗い部分がカットされます）</span>
        <span lang="en">Preview (Darkened areas will be cropped)</span>
      </div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>
    
    <div class="btn-container hidden" id="btnContainer">
      <button class="btn btn-primary" id="downloadBtn">
        <span lang="ja">一括ダウンロード（ZIP）</span>
        <span lang="en">Download All (ZIP)</span>
      </button>
      <button class="btn btn-secondary" id="clearBtn">
        <span lang="ja">クリア</span>
        <span lang="en">Clear</span>
      </button>
    </div>
    
    <div class="progress hidden" id="progress"></div>
    
    <canvas id="canvas"></canvas>
  </div>

  <footer class="main-footer">
    <a href="https://cloudavenue.jp" target="_blank">cloudavenue.jp</a>
  </footer>

  <!-- Shared Script Template -->
  <script id="cloudavenue-shared-script">
    (function() {
      const getStorage = (key, defaultVal) => localStorage.getItem(key) || defaultVal;
      const setStorage = (key, val) => localStorage.setItem(key, val);

      // Theme
      const themeSelect = document.getElementById('theme-select');
      const applyTheme = (theme) => {
        if (theme === 'system') {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      };
      const initTheme = () => {
        const saved = getStorage('cloudavenue-theme', 'light');
        if (themeSelect) themeSelect.value = saved;
        applyTheme(saved);
      };
      if (themeSelect) {
        themeSelect.addEventListener('change', (e) => {
          setStorage('cloudavenue-theme', e.target.value);
          applyTheme(e.target.value);
        });
      }

      // Language
      const langSelect = document.getElementById('lang-select');
      const applyLang = (lang) => {
        document.documentElement.setAttribute('lang', lang);
      };
      const initLang = () => {
        const defaultLang = (navigator.language || navigator.userLanguage).startsWith('ja') ? 'ja' : 'en';
        const saved = getStorage('cloudavenue-lang', defaultLang);
        if (langSelect) langSelect.value = saved;
        applyLang(saved);
      };
      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          setStorage('cloudavenue-lang', e.target.value);
          applyLang(e.target.value);
        });
      }

      initTheme();
      initLang();
    })();
  </script>

  <!-- App Specific Script -->
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const previewContainer = document.getElementById('previewContainer');
    const previewGrid = document.getElementById('previewGrid');
    const fileCount = document.getElementById('fileCount');
    const unitPx = document.getElementById('unitPx');
    const unitPercent = document.getElementById('unitPercent');
    const unitLabels = document.querySelectorAll('.unit-label');
    const topCut = document.getElementById('topCut');
    const topCutNum = document.getElementById('topCutNum');
    const bottomCut = document.getElementById('bottomCut');
    const bottomCutNum = document.getElementById('bottomCutNum');
    const leftCut = document.getElementById('leftCut');
    const leftCutNum = document.getElementById('leftCutNum');
    const rightCut = document.getElementById('rightCut');
    const rightCutNum = document.getElementById('rightCutNum');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const btnContainer = document.getElementById('btnContainer');
    const progress = document.getElementById('progress');
    const canvas = document.getElementById('canvas');
    
    let loadedImages = [];
    let unitMode = 'px';
    
    // Updates UI texts based on language
    const updateDynamicTexts = () => {
      if (loadedImages.length > 0) {
        const isEn = document.documentElement.lang === 'en';
        fileCount.innerHTML = isEn ? `Loaded files: ${loadedImages.length}` : `読み込んだファイル: ${loadedImages.length}件`;
      }
    };

    document.getElementById('lang-select').addEventListener('change', updateDynamicTexts);

    // 単位切り替え
    unitPx.addEventListener('click', () => {
      if (unitMode === 'px') return;
      unitMode = 'px';
      unitPx.classList.add('active');
      unitPercent.classList.remove('active');
      unitLabels.forEach(label => label.textContent = 'px');
      convertValues('percent', 'px');
      updateSliderMax();
    });
    
    unitPercent.addEventListener('click', () => {
      if (unitMode === 'percent') return;
      unitMode = 'percent';
      unitPercent.classList.add('active');
      unitPx.classList.remove('active');
      unitLabels.forEach(label => label.textContent = '%');
      convertValues('px', 'percent');
      updateSliderMax();
    });
    
    function convertValues(from, to) {
      if (loadedImages.length === 0) return;
      const firstImg = loadedImages[0].image;
      
      if (from === 'px' && to === 'percent') {
        topCut.value = topCutNum.value = Math.round((parseFloat(topCut.value) / firstImg.height) * 100);
        bottomCut.value = bottomCutNum.value = Math.round((parseFloat(bottomCut.value) / firstImg.height) * 100);
        leftCut.value = leftCutNum.value = Math.round((parseFloat(leftCut.value) / firstImg.width) * 100);
        rightCut.value = rightCutNum.value = Math.round((parseFloat(rightCut.value) / firstImg.width) * 100);
      } else {
        topCut.value = topCutNum.value = Math.round((parseFloat(topCut.value) / 100) * firstImg.height);
        bottomCut.value = bottomCutNum.value = Math.round((parseFloat(bottomCut.value) / 100) * firstImg.height);
        leftCut.value = leftCutNum.value = Math.round((parseFloat(leftCut.value) / 100) * firstImg.width);
        rightCut.value = rightCutNum.value = Math.round((parseFloat(rightCut.value) / 100) * firstImg.width);
      }
    }
    
    function updateSliderMax() {
      if (loadedImages.length === 0) return;
      
      if (unitMode === 'percent') {
        topCut.max = bottomCut.max = leftCut.max = rightCut.max = 50;
        topCutNum.max = bottomCutNum.max = leftCutNum.max = rightCutNum.max = 50;
        topCutNum.step = bottomCutNum.step = leftCutNum.step = rightCutNum.step = 1;
      } else {
        let maxWidth = 0;
        let maxHeight = 0;
        loadedImages.forEach(item => {
          if (item.image.width > maxWidth) maxWidth = item.image.width;
          if (item.image.height > maxHeight) maxHeight = item.image.height;
        });
        topCut.max = bottomCut.max = Math.floor(maxHeight / 2);
        leftCut.max = rightCut.max = Math.floor(maxWidth / 2);
        topCutNum.max = bottomCutNum.max = maxHeight;
        leftCutNum.max = rightCutNum.max = maxWidth;
        topCutNum.step = bottomCutNum.step = leftCutNum.step = rightCutNum.step = 1;
      }
    }
    
    // ドラッグ&ドロップ
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      if (files.length > 0) {
        loadImages(files);
      }
    });
    
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        loadImages(files);
      }
    });
    
    function loadImages(files) {
      loadedImages = [];
      let loaded = 0;
      
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            loadedImages.push({
              name: file.name.replace(/\.[^.]+$/, '') + '_cropped.png',
              image: img,
              dataUrl: e.target.result
            });
            loaded++;
            if (loaded === files.length) {
              showUI();
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    
    function showUI() {
      updateDynamicTexts();
      controls.classList.remove('hidden');
      previewContainer.classList.remove('hidden');
      btnContainer.classList.remove('hidden');
      
      updateSliderMax();
      updateAllPreviews();
    }
    
    function updateAllPreviews() {
      previewGrid.innerHTML = '';
      
      if (loadedImages.length === 1) {
        previewGrid.classList.add('single-image');
      } else {
        previewGrid.classList.remove('single-image');
      }
      
      loadedImages.forEach((item, index) => {
        const previewItem = document.createElement('div');
        previewItem.className = 'preview-item';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'preview-item-name';
        nameDiv.textContent = item.name;
        
        const sizeDiv = document.createElement('div');
        sizeDiv.className = 'preview-item-size';
        sizeDiv.dataset.index = index;
        
        const wrapper = document.createElement('div');
        wrapper.className = 'preview-wrapper';
        
        const img = document.createElement('img');
        img.src = item.dataUrl;
        img.dataset.index = index;
        img.onload = function() {
          updateOverlays(this, wrapper);
          updateItemSize(index, sizeDiv);
        };
        
        const overlayTop = document.createElement('div');
        overlayTop.className = 'crop-overlay crop-overlay-top';
        const overlayBottom = document.createElement('div');
        overlayBottom.className = 'crop-overlay crop-overlay-bottom';
        const overlayLeft = document.createElement('div');
        overlayLeft.className = 'crop-overlay crop-overlay-left';
        const overlayRight = document.createElement('div');
        overlayRight.className = 'crop-overlay crop-overlay-right';
        
        wrapper.appendChild(img);
        wrapper.appendChild(overlayTop);
        wrapper.appendChild(overlayBottom);
        wrapper.appendChild(overlayLeft);
        wrapper.appendChild(overlayRight);
        previewItem.appendChild(nameDiv);
        previewItem.appendChild(sizeDiv);
        previewItem.appendChild(wrapper);
        previewGrid.appendChild(previewItem);
      });
    }
    
    function updateOverlays(imgElement, wrapper) {
      const index = parseInt(imgElement.dataset.index);
      const originalImage = loadedImages[index].image;
      
      let top = parseFloat(topCut.value);
      let bottom = parseFloat(bottomCut.value);
      let left = parseFloat(leftCut.value);
      let right = parseFloat(rightCut.value);
      
      if (unitMode === 'percent') {
        top = Math.round((top / 100) * originalImage.height);
        bottom = Math.round((bottom / 100) * originalImage.height);
        left = Math.round((left / 100) * originalImage.width);
        right = Math.round((right / 100) * originalImage.width);
      }
      
      const displayWidth = imgElement.offsetWidth;
      const displayHeight = imgElement.offsetHeight;
      const scaleX = displayWidth / originalImage.width;
      const scaleY = displayHeight / originalImage.height;
      
      const overlayTop = wrapper.querySelector('.crop-overlay-top');
      const overlayBottom = wrapper.querySelector('.crop-overlay-bottom');
      const overlayLeft = wrapper.querySelector('.crop-overlay-left');
      const overlayRight = wrapper.querySelector('.crop-overlay-right');
      
      overlayTop.style.height = (top * scaleY) + 'px';
      overlayBottom.style.height = (bottom * scaleY) + 'px';
      overlayLeft.style.width = (left * scaleX) + 'px';
      overlayLeft.style.top = (top * scaleY) + 'px';
      overlayLeft.style.bottom = (bottom * scaleY) + 'px';
      overlayRight.style.width = (right * scaleX) + 'px';
      overlayRight.style.top = (top * scaleY) + 'px';
      overlayRight.style.bottom = (bottom * scaleY) + 'px';
    }
    
    function updateAllOverlays() {
      const images = previewGrid.querySelectorAll('.preview-wrapper img');
      images.forEach(img => {
        const wrapper = img.parentElement;
        updateOverlays(img, wrapper);
      });
      updateAllSizes();
    }
    
    function updateItemSize(index, sizeDiv) {
      const item = loadedImages[index];
      let top = parseFloat(topCut.value);
      let bottom = parseFloat(bottomCut.value);
      let left = parseFloat(leftCut.value);
      let right = parseFloat(rightCut.value);
      
      if (unitMode === 'percent') {
        top = Math.round((top / 100) * item.image.height);
        bottom = Math.round((bottom / 100) * item.image.height);
        left = Math.round((left / 100) * item.image.width);
        right = Math.round((right / 100) * item.image.width);
      }
      
      const outputWidth = item.image.width - left - right;
      const outputHeight = item.image.height - top - bottom;
      
      sizeDiv.textContent = `${item.image.width}×${item.image.height} → ${outputWidth}×${outputHeight}`;
    }
    
    function updateAllSizes() {
      const sizeDivs = previewGrid.querySelectorAll('.preview-item-size');
      sizeDivs.forEach(sizeDiv => {
        const index = parseInt(sizeDiv.dataset.index);
        updateItemSize(index, sizeDiv);
      });
    }
    
    topCut.addEventListener('input', () => { topCutNum.value = topCut.value; updateAllOverlays(); });
    topCutNum.addEventListener('input', () => { topCut.value = topCutNum.value; updateAllOverlays(); });
    bottomCut.addEventListener('input', () => { bottomCutNum.value = bottomCut.value; updateAllOverlays(); });
    bottomCutNum.addEventListener('input', () => { bottomCut.value = bottomCutNum.value; updateAllOverlays(); });
    leftCut.addEventListener('input', () => { leftCutNum.value = leftCut.value; updateAllOverlays(); });
    leftCutNum.addEventListener('input', () => { leftCut.value = leftCutNum.value; updateAllOverlays(); });
    rightCut.addEventListener('input', () => { rightCutNum.value = rightCut.value; updateAllOverlays(); });
    rightCutNum.addEventListener('input', () => { rightCut.value = rightCutNum.value; updateAllOverlays(); });
    
    window.addEventListener('resize', updateAllOverlays);
    
    clearBtn.addEventListener('click', () => {
      loadedImages = [];
      previewGrid.innerHTML = '';
      controls.classList.add('hidden');
      previewContainer.classList.add('hidden');
      btnContainer.classList.add('hidden');
      progress.classList.add('hidden');
      fileInput.value = '';
    });
    
    downloadBtn.addEventListener('click', async () => {
      if (loadedImages.length === 0) return;
      
      downloadBtn.disabled = true;
      progress.classList.remove('hidden');
      
      const isEn = document.documentElement.lang === 'en';
      progress.textContent = isEn ? 'Processing...' : '処理中...';
      
      const zip = new JSZip();
      const ctx = canvas.getContext('2d');
      
      for (let i = 0; i < loadedImages.length; i++) {
        const item = loadedImages[i];
        progress.textContent = isEn ? `Processing... ${i + 1} / ${loadedImages.length}` : `処理中... ${i + 1} / ${loadedImages.length}`;
        
        let top = parseFloat(topCut.value);
        let bottom = parseFloat(bottomCut.value);
        let left = parseFloat(leftCut.value);
        let right = parseFloat(rightCut.value);
        
        if (unitMode === 'percent') {
          top = Math.round((top / 100) * item.image.height);
          bottom = Math.round((bottom / 100) * item.image.height);
          left = Math.round((left / 100) * item.image.width);
          right = Math.round((right / 100) * item.image.width);
        }
        
        const outputWidth = item.image.width - left - right;
        const outputHeight = item.image.height - top - bottom;
        
        canvas.width = outputWidth;
        canvas.height = outputHeight;
        
        ctx.drawImage(
          item.image,
          left, top, outputWidth, outputHeight,
          0, 0, outputWidth, outputHeight
        );
        
        const dataUrl = canvas.toDataURL('image/png');
        const base64 = dataUrl.split(',')[1];
        zip.file(item.name, base64, {base64: true});
        
        await new Promise(resolve => setTimeout(resolve, 10));
      }
      
      progress.textContent = isEn ? 'Zipping files...' : 'ZIPファイル作成中...';
      
      const blob = await zip.generateAsync({type: 'blob'});
      const link = document.createElement('a');
      link.download = 'cropped_images.zip';
      link.href = URL.createObjectURL(blob);
      link.click();
      
      progress.textContent = isEn ? `Done! Processed ${loadedImages.length} files.` : `完了！ ${loadedImages.length} ファイルを処理しました`;
      downloadBtn.disabled = false;
    });
  </script>
</body>
</html>
