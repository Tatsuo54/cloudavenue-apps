<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch WebP Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style id="cloudavenue-shared-css">
    /* --- Base Styles & Theme --- */
    :root {
      --bg: #E8F0F8;
      --surface: #FFFFFF;
      --surface2: #DCE4EE;
      --border: #B8C5D6;
      --text: #4A5568;
      --text-dim: #718096;
      --accent: #829DB0;
      --accent-dim: #A2B5C9;
      --primary: #6B8EAD;
      --primary-hover: #567691;
      --hover-bg: #F0F7FF;
      --sans-font: 'Roboto', 'Noto Sans JP', sans-serif;
      --mono-font: 'JetBrains Mono', 'SF Mono', monospace;
      --shadow-sm: 0 4px 12px rgba(130,157,176,0.12);
      --shadow-md: 0 8px 24px rgba(130,157,176,0.18);
      
      /* Context Specific mappings */
      --info-bg: #d1e0e3; 
      --info-text: #2b5a61;
      --warn-bg: #eedbd0; 
      --warn-text: #7a4a31;
      --success-bg: #cfdfd5; 
      --success-text: #3e5e49;
    }

    [data-theme="dark"] {
      --bg: #1a202c;
      --surface: #2d3748;
      --surface2: #4a5568;
      --border: #718096;
      --text: #e2e8f0;
      --text-dim: #a0aec0;
      --accent: #829DB0;
      --accent-dim: #627A8A;
      --primary: #6B8EAD;
      --primary-hover: #829DB0;
      --hover-bg: #2d3748;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.5);

      --info-bg: #2b5a61;
      --info-text: #d1e0e3;
      --warn-bg: #4a2e1d;
      --warn-text: #eedbd0;
      --success-bg: #2b3d31;
      --success-text: #cfdfd5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans-font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Language Toggle CSS --- */
    html[lang="ja"] [lang="en"] { display: none !important; }
    html[lang="en"] [lang="ja"] { display: none !important; }

    /* --- Layout & Utilities --- */
    .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; flex: 1; position: relative; }
    h1.page-title { display: block; font-size: 42px; font-weight: 700; color: var(--primary); letter-spacing: -0.01em; margin-bottom: 32px; text-align: center; }
    .hidden { display: none !important; }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--text); }

    /* --- Top Nav (Header) --- */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-left { display: flex; align-items: center; justify-content: flex-start; gap: 15px; margin-right: auto; }
    .back-link {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: var(--text); }

    /* --- Toggles (Select) --- */
    .ctrl-select {
      font-family: var(--sans-font);
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .ctrl-select:focus { border-color: var(--accent); }

    /* --- Form Controls & Buttons --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--sans-font);
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-primary:disabled { background: var(--border); border-color: var(--border); cursor: not-allowed; transform: none; }
    
    .btn-secondary { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
    .btn-secondary:hover { background: var(--hover-bg); border-color: var(--accent); }

    .btn-container { display: flex; gap: 15px; flex-wrap: wrap; }

    /* --- Footer --- */
    .main-footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: auto;
      font-size: 14px;
      color: var(--text-dim);
    }

    /* --- App Specific Styles --- */
    .drop-zone {
      border: 3px dashed var(--border);
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--bg);
    }
    .drop-zone p { margin: 0; color: var(--text-dim); }
    
    .controls {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .control-section { margin-bottom: 15px; }
    .control-section:last-child { margin-bottom: 0; }
    .section-title {
      font-weight: bold;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .control-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .control-row:last-child { margin-bottom: 0; }
    .control-row label { width: 100px; font-weight: bold; color: var(--text); font-size: 13px;}
    
    .control-row input[type="range"] {
      flex: 1; height: 8px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 4px; outline: none;
    }
    .control-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    .control-row input[type="number"] {
      width: 80px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text);
    }
    
    .file-count {
      background: var(--warn-bg); padding: 10px 15px; border-radius: 8px; font-size: 14px; color: var(--warn-text); margin-bottom: 15px; font-weight: bold;
    }
    
    .size-summary {
      background: var(--success-bg); padding: 10px 15px; border-radius: 8px; font-size: 14px; color: var(--success-text);
    }
    
    .preview-container {
      background: var(--surface); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; border: 1px solid var(--border);
    }
    .preview-label { font-weight: bold; margin-bottom: 15px; color: var(--text); font-size: 14px;}
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .preview-grid.single-image { grid-template-columns: 1fr; max-width: 600px; margin: 0 auto; }
    .preview-grid.single-image .preview-wrapper img { max-height: none; }
    
    .preview-item { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid var(--border);}
    .preview-item-name { font-size: 12px; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold;}
    .preview-item-size { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-family: var(--mono-font);}
    .preview-item-size .reduced { color: var(--primary); font-weight: bold; }
    
    .preview-wrapper { position: relative; display: inline-block; max-width: 100%; }
    .preview-wrapper img { max-width: 100%; max-height: 150px; display: block; margin: 0 auto; border-radius: 4px;}
    
    canvas { display: none; }
    .progress { margin-top: 15px; padding: 10px 15px; background: var(--success-bg); border-radius: 8px; color: var(--success-text); font-size: 14px; font-weight: bold;}
  </style>
</head>
<body>

  <!-- Shared Navigation Template -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span lang="ja">トップに戻る</span><span lang="en">Back to Top</span>
      </a>
    </div>
    <div class="nav-right">
      <select id="theme-select" class="ctrl-select">
        <option value="light" lang="ja">ライト</option><option value="light" lang="en">Light</option>
        <option value="dark" lang="ja">ダーク</option><option value="dark" lang="en">Dark</option>
        <option value="system" lang="ja">システム</option><option value="system" lang="en">System</option>
      </select>
      <select id="lang-select" class="ctrl-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">
      <span lang="ja">WebP一括変換ツール</span><span lang="en">Batch WebP Converter</span>
    </h1>
    
    <div class="drop-zone" id="dropZone">
      <p>
        <span lang="ja">複数の画像をドラッグ&ドロップ<br>またはクリックして選択</span>
        <span lang="en">Drag & drop multiple images<br>or click to select</span>
      </p>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>
    
    <div class="controls hidden" id="controls">
      <div class="file-count" id="fileCount">
        <span lang="ja">読み込んだファイル: 0件</span>
        <span lang="en">Loaded files: 0</span>
      </div>
      <div class="control-section">
        <div class="section-title">
          <span lang="ja">変換設定</span>
          <span lang="en">Conversion Settings</span>
        </div>
        <div class="control-row">
          <label>
            <span lang="ja">品質</span>
            <span lang="en">Quality</span>
          </label>
          <input type="range" id="quality" min="1" max="100" value="80">
          <input type="number" id="qualityNum" min="1" max="100" value="80"> %
        </div>
      </div>
      <div class="control-section">
        <div class="size-summary" id="sizeSummary">
          <span lang="ja">変換前: - / 変換後（推定）: - / 削減率: -</span>
          <span lang="en">Original: - / Estimated: - / Reduction: -</span>
        </div>
      </div>
    </div>
    
    <div class="preview-container hidden" id="previewContainer">
      <div class="preview-label">
        <span lang="ja">プレビュー</span>
        <span lang="en">Preview</span>
      </div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>
    
    <div class="btn-container hidden" id="btnContainer">
      <button class="btn btn-primary" id="downloadBtn">
        <span lang="ja">一括変換してダウンロード（ZIP）</span>
        <span lang="en">Convert and Download All (ZIP)</span>
      </button>
      <button class="btn btn-secondary" id="clearBtn">
        <span lang="ja">クリア</span>
        <span lang="en">Clear</span>
      </button>
    </div>
    
    <div class="progress hidden" id="progress"></div>
    
    <canvas id="canvas"></canvas>
  </div>

  <footer class="main-footer">
    <a href="https://cloudavenue.jp" target="_blank">cloudavenue.jp</a>
  </footer>

  <!-- Shared Script Template -->
  <script id="cloudavenue-shared-script">
    (function() {
      const getStorage = (key, defaultVal) => localStorage.getItem(key) || defaultVal;
      const setStorage = (key, val) => localStorage.setItem(key, val);

      // Theme
      const themeSelect = document.getElementById('theme-select');
      const applyTheme = (theme) => {
        if (theme === 'system') {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      };
      const initTheme = () => {
        const saved = getStorage('cloudavenue-theme', 'light');
        if (themeSelect) themeSelect.value = saved;
        applyTheme(saved);
      };
      if (themeSelect) {
        themeSelect.addEventListener('change', (e) => {
          setStorage('cloudavenue-theme', e.target.value);
          applyTheme(e.target.value);
        });
      }

      // Language
      const langSelect = document.getElementById('lang-select');
      const applyLang = (lang) => {
        document.documentElement.setAttribute('lang', lang);
      };
      const initLang = () => {
        const defaultLang = (navigator.language || navigator.userLanguage).startsWith('ja') ? 'ja' : 'en';
        const saved = getStorage('cloudavenue-lang', defaultLang);
        if (langSelect) langSelect.value = saved;
        applyLang(saved);
      };
      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          setStorage('cloudavenue-lang', e.target.value);
          applyLang(e.target.value);
        });
      }

      initTheme();
      initLang();
    })();
  </script>

  <!-- App Specific Script -->
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const previewContainer = document.getElementById('previewContainer');
    const previewGrid = document.getElementById('previewGrid');
    const fileCount = document.getElementById('fileCount');
    const quality = document.getElementById('quality');
    const qualityNum = document.getElementById('qualityNum');
    const sizeSummary = document.getElementById('sizeSummary');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const btnContainer = document.getElementById('btnContainer');
    const progress = document.getElementById('progress');
    const canvas = document.getElementById('canvas');
    
    let loadedImages = [];
    let savedTotalOriginal = 0;
    let savedTotalEstimated = 0;
    
    const updateDynamicTexts = () => {
      const isEn = document.documentElement.lang === 'en';
      if (loadedImages.length > 0) {
        fileCount.innerHTML = isEn ? `Loaded files: ${loadedImages.length}` : `読み込んだファイル: ${loadedImages.length}件`;
        
        if (savedTotalOriginal > 0) {
          const reduction = Math.round((1 - savedTotalEstimated / savedTotalOriginal) * 100);
          if (isEn) {
            sizeSummary.innerHTML = `Original: <strong>${formatSize(savedTotalOriginal)}</strong> / Estimated: <strong>${formatSize(savedTotalEstimated)}</strong> / Reduction: <strong>${reduction > 0 ? '-' : '+'}${Math.abs(reduction)}%</strong>`;
          } else {
            sizeSummary.innerHTML = `変換前: <strong>${formatSize(savedTotalOriginal)}</strong> / 変換後（推定）: <strong>${formatSize(savedTotalEstimated)}</strong> / 削減率: <strong>${reduction > 0 ? '-' : '+'}${Math.abs(reduction)}%</strong>`;
          }
        }
      }
    };
    
    document.getElementById('lang-select').addEventListener('change', updateDynamicTexts);

    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      if (files.length > 0) {
        loadImages(files);
      }
    });
    
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        loadImages(files);
      }
    });
    
    function loadImages(files) {
      loadedImages = [];
      let loaded = 0;
      
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            loadedImages.push({
              name: file.name.replace(/\.[^.]+$/, '') + '.webp',
              image: img,
              dataUrl: e.target.result,
              originalSize: file.size,
              file: file
            });
            loaded++;
            if (loaded === files.length) {
              showUI();
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    
    function showUI() {
      controls.classList.remove('hidden');
      previewContainer.classList.remove('hidden');
      btnContainer.classList.remove('hidden');
      updatePreviews();
      updateSizeSummary();
      updateDynamicTexts();
    }
    
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }
    
    async function estimateWebPSize(img, q) {
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      const dataUrl = canvas.toDataURL('image/webp', q / 100);
      const base64 = dataUrl.split(',')[1];
      return Math.round(base64.length * 0.75);
    }
    
    async function updatePreviews() {
      previewGrid.innerHTML = '';
      
      if (loadedImages.length === 1) {
        previewGrid.classList.add('single-image');
      } else {
        previewGrid.classList.remove('single-image');
      }
      
      const q = parseInt(quality.value);
      
      for (let i = 0; i < loadedImages.length; i++) {
        const item = loadedImages[i];
        const estimatedSize = await estimateWebPSize(item.image, q);
        const reduction = Math.round((1 - estimatedSize / item.originalSize) * 100);
        
        const previewItem = document.createElement('div');
        previewItem.className = 'preview-item';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'preview-item-name';
        nameDiv.textContent = item.name;
        
        const sizeDiv = document.createElement('div');
        sizeDiv.className = 'preview-item-size';
        sizeDiv.innerHTML = `${formatSize(item.originalSize)} → ${formatSize(estimatedSize)} <span class="reduced">(${reduction > 0 ? '-' : '+'}${Math.abs(reduction)}%)</span>`;
        
        const wrapper = document.createElement('div');
        wrapper.className = 'preview-wrapper';
        
        const img = document.createElement('img');
        img.src = item.dataUrl;
        
        wrapper.appendChild(img);
        previewItem.appendChild(nameDiv);
        previewItem.appendChild(sizeDiv);
        previewItem.appendChild(wrapper);
        previewGrid.appendChild(previewItem);
      }
    }
    
    async function updateSizeSummary() {
      const q = parseInt(quality.value);
      let totalOriginal = 0;
      let totalEstimated = 0;
      
      for (const item of loadedImages) {
        totalOriginal += item.originalSize;
        totalEstimated += await estimateWebPSize(item.image, q);
      }
      
      savedTotalOriginal = totalOriginal;
      savedTotalEstimated = totalEstimated;
      
      updateDynamicTexts();
    }
    
    let updateTimeout;
    function debouncedUpdate() {
      clearTimeout(updateTimeout);
      updateTimeout = setTimeout(() => {
        updatePreviews();
        updateSizeSummary();
      }, 300);
    }
    
    quality.addEventListener('input', () => {
      qualityNum.value = quality.value;
      debouncedUpdate();
    });
    qualityNum.addEventListener('input', () => {
      quality.value = qualityNum.value;
      debouncedUpdate();
    });
    
    clearBtn.addEventListener('click', () => {
      loadedImages = [];
      previewGrid.innerHTML = '';
      controls.classList.add('hidden');
      previewContainer.classList.add('hidden');
      btnContainer.classList.add('hidden');
      progress.classList.add('hidden');
      fileInput.value = '';
    });
    
    downloadBtn.addEventListener('click', async () => {
      if (loadedImages.length === 0) return;
      
      downloadBtn.disabled = true;
      progress.classList.remove('hidden');
      const isEn = document.documentElement.lang === 'en';
      progress.textContent = isEn ? 'Converting...' : '変換中...';
      
      const q = parseInt(quality.value);
      const zip = new JSZip();
      const ctx = canvas.getContext('2d');
      
      for (let i = 0; i < loadedImages.length; i++) {
        const item = loadedImages[i];
        progress.textContent = isEn ? `Converting... ${i + 1} / ${loadedImages.length}` : `変換中... ${i + 1} / ${loadedImages.length}`;
        
        canvas.width = item.image.width;
        canvas.height = item.image.height;
        ctx.drawImage(item.image, 0, 0);
        
        const dataUrl = canvas.toDataURL('image/webp', q / 100);
        const base64 = dataUrl.split(',')[1];
        zip.file(item.name, base64, {base64: true});
        
        await new Promise(resolve => setTimeout(resolve, 10));
      }
      
      progress.textContent = isEn ? 'Zipping files...' : 'ZIPファイル作成中...';
      
      const blob = await zip.generateAsync({type: 'blob'});
      const link = document.createElement('a');
      link.download = 'webp_images.zip';
      link.href = URL.createObjectURL(blob);
      link.click();
      
      progress.textContent = isEn ? `Done! Converted ${loadedImages.length} files.` : `完了！ ${loadedImages.length} ファイルを変換しました`;
      downloadBtn.disabled = false;
    });
  </script>
</body>
</html>
