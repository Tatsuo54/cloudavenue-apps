<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross Search Tool</title>
  <style id="cloudavenue-shared-css">
    /* --- Base Styles & Theme --- */
    :root {
      --bg: #f3f5f3; --surface: #ffffff; --surface2: #dae0da;
      --border: #cad1ca; --text: #3c453c; --text-dim: #758075;
      --accent: #78909c; --accent-dim: #b0bec5;
      --primary: #81a18b; --primary-hover: #6d8a77;
      --danger: #c98a8a; --danger-bg: #faf4f0;
      --warning-border: #d19a7e; --warning-bg: #faf4f0; --warning-text: #a0522d;
      --sans-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono-font: 'JetBrains Mono', 'SF Mono', monospace;
    }
    [data-theme="dark"] {
      --bg: #1e2220; --surface: #262b28; --surface2: #303632;
      --border: #424a44; --text: #e6e9e6; --text-dim: #a0afa4;
      --accent: #90a4ae; --accent-dim: #607d8b;
      --primary: #6d8a77; --primary-hover: #81a18b;
      --danger: #c98a8a; --danger-bg: #3a2211;
      --warning-border: #ba7e60; --warning-bg: #3a2211; --warning-text: #eedbd0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans-font); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    html[lang="ja"] [lang="en"] { display: none !important; }
    html[lang="en"] [lang="ja"] { display: none !important; }

    /* --- Layout --- */
    .container { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px 40px; flex: 1; }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--text); }

    /* --- Top Nav --- */
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-left { display: flex; align-items: center; gap: 15px; margin-right: auto; }
    .back-link { font-size: 14px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    .back-link:hover { color: var(--text); }
    .ctrl-select { font-family: var(--sans-font); font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; outline: none; }
    .ctrl-select:focus { border-color: var(--accent); }

    /* --- Page Toggle --- */
    .page { display: none; }
    .page.active { display: block; }

    /* --- Preset Row --- */
    .preset-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 16px; }
    .preset-row .select-wrap { flex: 1; }
    .preset-row .select-wrap label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; font-weight: 600; }
    .preset-select { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--sans-font); cursor: pointer; }
    .preset-settings-btn { padding: 8px 14px; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text-dim); white-space: nowrap; font-weight: 600; transition: all 0.2s; }
    .preset-settings-btn:hover { background: var(--surface2); color: var(--text); }

    /* --- Form Controls --- */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: var(--text); }
    .form-control { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--sans-font); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(120, 144, 156, 0.2); }
    .form-control.error { border-color: var(--danger); }

    /* --- Buttons --- */
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; font-size: 14px; font-weight: 600; border: 1px solid transparent; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: var(--sans-font); }
    .btn-primary { flex: 1; background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { padding: 10px 16px; background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface2); color: var(--text); }
    .btn-danger-sm { padding: 4px 8px; font-size: 11px; background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 4px; cursor: pointer; font-family: var(--sans-font); transition: all 0.2s; }
    .btn-danger-sm:hover { background: var(--danger); color: #fff; }

    /* --- Results --- */
    .results { display: none; margin-top: 24px; }
    .results.show { display: block; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .results-header h2 { font-size: 16px; color: var(--text); }
    .query-badge { padding: 3px 10px; background: var(--surface2); color: var(--accent); border-radius: 10px; font-size: 12px; font-family: var(--mono-font); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open-all-btn { width: 100%; padding: 10px; font-size: 13px; background: var(--primary); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: var(--sans-font); margin-bottom: 6px; transition: all 0.2s; }
    .open-all-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .popup-note { font-size: 11px; color: var(--text-dim); text-align: center; margin-bottom: 14px; }
    .link-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .link-btn { display: flex; align-items: center; justify-content: center; padding: 10px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: var(--text); font-size: 13px; text-align: center; transition: all 0.2s; font-weight: 600; }
    .link-btn:hover { background: var(--surface2); border-color: var(--accent-dim); color: var(--text); }
    .link-btn.warning { border-color: var(--warning-border); background: var(--warning-bg); color: var(--warning-text); }
    .link-btn.warning:hover { border-color: var(--accent); }

    /* --- Divider --- */
    .divider { border-top: 1px solid var(--border); margin: 24px 0; }

    /* --- History --- */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .history-header h3 { font-size: 14px; color: var(--text-dim); }
    .history-list { list-style: none; max-height: 260px; overflow-y: auto; }
    .history-item { padding: 10px 6px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text); transition: background 0.15s; }
    .history-item:hover { background: var(--surface2); }
    .history-date { color: var(--text-dim); font-size: 11px; font-family: var(--mono-font); }
    .history-preset { font-size: 10px; color: var(--text-dim); background: var(--surface2); padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
    .no-history { color: var(--text-dim); font-size: 13px; padding: 12px 0; }

    /* --- Footer --- */
    .main-footer { text-align: center; padding: 30px 20px; margin-top: auto; font-size: 14px; color: var(--text-dim); }

    /* --- Settings Page --- */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text-dim); margin-bottom: 16px; font-family: var(--sans-font); font-weight: 600; transition: all 0.2s; }
    .back-btn:hover { background: var(--surface2); color: var(--text); }
    .settings-title { font-size: 18px; margin-bottom: 20px; color: var(--text); }
    .settings-section { margin-bottom: 24px; }
    .settings-section h3 { font-size: 15px; margin-bottom: 4px; color: var(--text); }
    .settings-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
    .preset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
    .preset-card.custom { border-color: var(--accent-dim); }
    .preset-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .preset-card-name { font-weight: 600; font-size: 14px; }
    .preset-card-locale { font-size: 10px; color: var(--text-dim); background: var(--surface2); padding: 2px 8px; border-radius: 8px; }
    .preset-card-searches { font-size: 12px; color: var(--text-dim); }
    .preset-actions { display: flex; gap: 8px; margin-top: 8px; }
    .preset-actions button { font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--sans-font); transition: all 0.2s; }
    .preset-actions button:hover { background: var(--surface2); }
    .preset-actions button.delete { color: var(--danger); border-color: var(--danger); }
    .preset-actions button.delete:hover { background: var(--danger); color: #fff; }
    .btn-add { width: 100%; padding: 10px; font-size: 14px; background: var(--surface); color: var(--primary); border: 1px dashed var(--primary); border-radius: 6px; cursor: pointer; margin-top: 10px; font-family: var(--sans-font); font-weight: 600; transition: all 0.2s; }
    .btn-add:hover { background: var(--surface2); }

    /* --- Modal --- */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 100; }
    .modal-overlay.show { display: flex; align-items: flex-start; justify-content: center; padding-top: 30px; }
    .modal { background: var(--surface); border-radius: 10px; padding: 20px; width: 94%; max-width: 560px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); }
    .modal h3 { font-size: 16px; margin-bottom: 16px; color: var(--text); }
    .modal .form-group { margin-bottom: 10px; }
    .modal .form-control { padding: 8px 10px; font-size: 13px; }

    /* --- Search Entries --- */
    .search-entry { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; position: relative; }
    .search-entry .remove-entry { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 18px; line-height: 1; }
    .entry-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .entry-row .entry-field { flex: 1; }
    .entry-row .entry-field label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; }
    .entry-row .entry-field input, .entry-row .entry-field select { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-family: var(--sans-font); }
    .entry-query-row { margin-top: 6px; }
    .entry-query-row label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; }
    .entry-query-row input { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); }
    .entry-url-preview { margin-top: 6px; padding: 6px 10px; background: var(--surface2); border-radius: 4px; font-size: 11px; font-family: var(--mono-font); color: var(--accent); word-break: break-all; cursor: pointer; border: 1px solid transparent; transition: border-color 0.15s; }
    .entry-url-preview:hover { border-color: var(--accent-dim); }
    .entry-url-edit { display: none; margin-top: 6px; }
    .entry-url-edit input { width: 100%; padding: 6px 8px; font-size: 12px; font-family: var(--mono-font); border: 1px solid var(--accent); border-radius: 4px; background: var(--surface); color: var(--text); }
    .entry-url-edit.show { display: block; }
    .entry-options { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .entry-options label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .entry-validation { font-size: 11px; color: var(--danger); margin-top: 4px; display: none; }

    .btn-add-search { font-size: 12px; padding: 6px 14px; background: var(--surface); border: 1px dashed var(--text-dim); border-radius: 4px; cursor: pointer; color: var(--text-dim); font-family: var(--sans-font); transition: all 0.2s; }
    .btn-add-search:hover { border-color: var(--primary); color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: var(--sans-font); font-weight: 600; transition: all 0.2s; }
    .modal-actions .save { background: var(--primary); color: white; border: none; }
    .modal-actions .save:hover { background: var(--primary-hover); }
    .modal-actions .cancel { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .modal-actions .cancel:hover { background: var(--surface2); }
    .json-toggle { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: var(--sans-font); }
    .json-editor { width: 100%; min-height: 140px; font-family: var(--mono-font); font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 10px; display: none; background: var(--surface); color: var(--text); resize: vertical; }
    .json-editor.show { display: block; }
    .json-error { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }
    .search-count { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }

    @media (max-width: 480px) { .link-grid { grid-template-columns: 1fr; } .entry-row { flex-direction: column; gap: 4px; } }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span lang="ja">トップに戻る</span><span lang="en">Back to Top</span>
      </a>
    </div>
    <div class="nav-right">
      <select id="theme-select" class="ctrl-select">
        <option value="auto" lang="ja">テーマ: 自動</option><option value="auto" lang="en">Theme: Auto</option>
        <option value="light" lang="ja">ライト</option><option value="light" lang="en">Light</option>
        <option value="dark" lang="ja">ダーク</option><option value="dark" lang="en">Dark</option>
      </select>
      <select id="lang-select" class="ctrl-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
  </nav>

  <div class="container">
    <!-- PAGE: Main -->
    <div class="page active" id="pageMain">
      <div class="preset-row">
        <div class="select-wrap">
          <label id="lbl-preset"></label>
          <select class="preset-select" id="presetSelect"></select>
        </div>
        <button class="preset-settings-btn" id="openSettings"></button>
      </div>
      <div class="form-group">
        <label class="form-label" id="lbl-search" for="searchInput"></label>
        <input type="text" id="searchInput" class="form-control">
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="searchBtn"></button>
        <button class="btn btn-secondary" id="clearInputBtn"></button>
      </div>

      <div class="results" id="results">
        <div class="results-header">
          <h2 id="lbl-searchLinks"></h2>
          <span class="query-badge" id="queryBadge"></span>
        </div>
        <button class="open-all-btn" id="openAllBtn"></button>
        <p class="popup-note" id="lbl-popupNote"></p>
        <div class="link-grid" id="linkGrid"></div>
      </div>

      <div class="divider"></div>
      <div class="history-header">
        <h3 id="lbl-history"></h3>
        <button class="btn-danger-sm" id="clearBtn"></button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>

    <!-- PAGE: Settings -->
    <div class="page" id="pageSettings">
      <button class="back-btn" id="backToMain">← <span id="lbl-settingsBack"></span></button>
      <h1 class="settings-title" id="lbl-settingsTitle"></h1>
      <div class="settings-section">
        <h3 id="lbl-builtinTitle"></h3>
        <p class="settings-desc" id="lbl-builtinDesc"></p>
        <div id="builtinList"></div>
      </div>
      <div class="settings-section">
        <h3 id="lbl-customTitle"></h3>
        <p class="settings-desc" id="lbl-customDesc"></p>
        <div id="customList"></div>
        <button class="btn-add" id="addCustomBtn"></button>
      </div>
    </div>
  </div>

  <!-- Modal: Edit Preset -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <div class="form-group">
        <label class="form-label" id="lbl-presetName"></label>
        <input type="text" id="editName" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label" id="lbl-locale"></label>
        <select id="editLocale" class="form-control">
          <option value="ja" id="opt-localeJa"></option>
          <option value="en" id="opt-localeEn"></option>
        </select>
      </div>
      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="search-count" id="searchCount"></span>
        <button class="json-toggle" id="jsonToggle"></button>
      </div>
      <textarea class="json-editor" id="jsonEditor" placeholder='[{"label":"Google","url":"https://...{query}","warning":false}]'></textarea>
      <div class="json-error" id="jsonError"></div>
      <div id="searchEntries"></div>
      <button class="btn-add-search" id="addSearchEntry"></button>
      <div class="modal-actions">
        <button class="cancel" id="editCancel"></button>
        <button class="save" id="editSave"></button>
      </div>
    </div>
  </div>

  <footer class="main-footer">
    <a href="https://cloudavenue.jp" target="_blank">cloudavenue.jp</a>
  </footer>

  <script>

// --- Storage Helper (localStorage wrapper) ---
const Store = {
  _get(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch { return def; } },
  _set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
  getCustomPresets() { return this._get('cc-customPresets', []); },
  saveCustomPresets(p) { this._set('cc-customPresets', p); },
  getActivePresetId() { return localStorage.getItem('cc-activePresetId') || ''; },
  setActivePresetId(id) { localStorage.setItem('cc-activePresetId', id); },
  getHistory() { return this._get('cc-history', []); },
  saveHistory(h) { this._set('cc-history', h); },
  clearHistory() { localStorage.removeItem('cc-history'); },
};

function getAllPresets() { return [...BUILTIN_PRESETS, ...Store.getCustomPresets()]; }
function getActivePreset() {
  const all = getAllPresets();
  const id = Store.getActivePresetId();
  if (id) { const f = all.find(p => p.id === id); if (f) return f; }
  const isJa = getLang() === 'ja';
  return all.find(p => p.id === (isJa ? 'general-ja' : 'general-en')) || all[0];
}
function buildUrls(preset, query) {
  return preset.searches.map(s => ({
    label: s.label,
    url: s.url.replace(/\{query\}/g, encodeURIComponent(query)),
    warning: s.warning
  }));
}

// --- Helpers ---
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n) { return String(n).padStart(2,'0'); }

// Main App Logic
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // --- Theme & Language (shared logic) ---
  const themeSelect = document.getElementById('theme-select');
  const langSelect = document.getElementById('lang-select');
  const applyTheme = (theme) => {
    if (theme === 'auto') {
      document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
  };
  const savedTheme = localStorage.getItem('cloudavenue-theme') || 'auto';
  themeSelect.value = savedTheme; applyTheme(savedTheme);
  themeSelect.addEventListener('change', e => { localStorage.setItem('cloudavenue-theme', e.target.value); applyTheme(e.target.value); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((localStorage.getItem('cloudavenue-theme') || 'auto') === 'auto') applyTheme('auto');
  });
  const defaultLang = (navigator.language || '').startsWith('ja') ? 'ja' : 'en';
  const savedLang = localStorage.getItem('cloudavenue-lang') || defaultLang;
  langSelect.value = savedLang;
  document.documentElement.setAttribute('lang', savedLang);
  langSelect.addEventListener('change', e => {
    localStorage.setItem('cloudavenue-lang', e.target.value);
    document.documentElement.setAttribute('lang', e.target.value);
    applyI18n(); loadPresetSelect(); renderHistory();
  });

  // --- Element Refs ---
  const pageMain = document.getElementById('pageMain');
  const pageSettings = document.getElementById('pageSettings');
  const searchInput = document.getElementById('searchInput');
  const resultsDiv = document.getElementById('results');
  const linkGrid = document.getElementById('linkGrid');
  const queryBadge = document.getElementById('queryBadge');
  const presetSelect = document.getElementById('presetSelect');
  let currentLinks = [];

  // --- i18n: Apply all labels ---
  function applyI18n() {
    document.getElementById('lbl-preset').textContent = M('presetLabel');
    document.getElementById('openSettings').textContent = M('presetSettings');
    document.getElementById('lbl-search').textContent = M('searchLabel');
    searchInput.placeholder = M('searchPlaceholder');
    document.getElementById('searchBtn').textContent = M('searchBtn');
    document.getElementById('clearInputBtn').textContent = M('clearInputBtn');
    document.getElementById('lbl-searchLinks').textContent = M('searchLinksHeader');
    document.getElementById('openAllBtn').textContent = M('openAllBtn');
    document.getElementById('lbl-popupNote').textContent = M('popupNote');
    document.getElementById('lbl-history').textContent = M('historyHeader');
    document.getElementById('clearBtn').textContent = M('clearHistoryBtn');
    document.getElementById('lbl-settingsBack').textContent = M('settingsBack');
    document.getElementById('lbl-settingsTitle').textContent = M('settingsTitle');
    document.getElementById('lbl-builtinTitle').textContent = M('builtinPresetsTitle');
    document.getElementById('lbl-builtinDesc').textContent = M('builtinPresetsDesc');
    document.getElementById('lbl-customTitle').textContent = M('customPresetsTitle');
    document.getElementById('lbl-customDesc').textContent = M('customPresetsDesc');
    document.getElementById('addCustomBtn').textContent = M('addCustomBtn');
    document.getElementById('addSearchEntry').textContent = M('addSearchEntry');
    document.getElementById('editCancel').textContent = M('cancelBtn');
    document.getElementById('editSave').textContent = M('saveBtn');
    document.getElementById('jsonToggle').textContent = M('jsonToggle');
    document.getElementById('editName').placeholder = M('presetNamePlaceholder');
    document.getElementById('lbl-presetName').textContent = M('presetNameLabel');
    document.getElementById('lbl-locale').textContent = M('localeLabel');
    document.getElementById('opt-localeJa').textContent = M('localeJa');
    document.getElementById('opt-localeEn').textContent = M('localeEn');
    document.title = 'Cross Search Tool';
  }
  applyI18n();

  // --- Page Navigation ---
  document.getElementById('openSettings').addEventListener('click', () => {
    pageMain.classList.remove('active'); pageSettings.classList.add('active'); renderSettings();
  });
  document.getElementById('backToMain').addEventListener('click', () => {
    pageSettings.classList.remove('active'); pageMain.classList.add('active'); loadPresetSelect();
  });

  // --- Preset Selector ---
  function loadPresetSelect() {
    const all = getAllPresets();
    const active = getActivePreset();
    presetSelect.innerHTML = '';
    const isJa = getLang() === 'ja';
    const jaGroup = document.createElement('optgroup'); jaGroup.label = M('optgroupJa');
    const enGroup = document.createElement('optgroup'); enGroup.label = M('optgroupEn');
    const customGroup = document.createElement('optgroup'); customGroup.label = M('optgroupCustom');
    all.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.name;
      if (p.id === active.id) opt.selected = true;
      if (!p.builtin) customGroup.appendChild(opt);
      else if (p.locale === 'ja') jaGroup.appendChild(opt);
      else enGroup.appendChild(opt);
    });
    if (isJa) {
      if (jaGroup.children.length) presetSelect.appendChild(jaGroup);
      if (enGroup.children.length) presetSelect.appendChild(enGroup);
    } else {
      if (enGroup.children.length) presetSelect.appendChild(enGroup);
      if (jaGroup.children.length) presetSelect.appendChild(jaGroup);
    }
    if (customGroup.children.length) presetSelect.appendChild(customGroup);
  }
  presetSelect.addEventListener('change', () => Store.setActivePresetId(presetSelect.value));
  loadPresetSelect();

  // --- Search ---
  function doSearch(query, presetId) {
    query = query || searchInput.value.trim();
    if (!query) { searchInput.classList.add('error'); searchInput.focus(); return; }
    let preset;
    if (presetId) { preset = getAllPresets().find(p => p.id === presetId); }
    if (!preset) preset = getActivePreset();
    if (presetId) {
      const opt = presetSelect.querySelector(`option[value="${presetId}"]`);
      if (opt) { presetSelect.value = presetId; Store.setActivePresetId(presetId); }
    }
    const searches = buildUrls(preset, query);
    currentLinks = searches.map(s => s.url);
    queryBadge.textContent = query;
    linkGrid.innerHTML = '';
    searches.forEach(s => {
      const a = document.createElement('a');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.className = `link-btn ${s.warning ? 'warning' : ''}`;
      a.textContent = s.label;
      linkGrid.appendChild(a);
    });
    resultsDiv.classList.add('show');
    searchInput.value = query;
    saveToHistory(query, preset.id, preset.name);
    renderHistory();
  }
  document.getElementById('searchBtn').addEventListener('click', () => doSearch());
  searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });
  searchInput.addEventListener('input', () => searchInput.classList.remove('error'));
  document.getElementById('clearInputBtn').addEventListener('click', () => {
    searchInput.value = ''; resultsDiv.classList.remove('show');
    linkGrid.innerHTML = ''; queryBadge.textContent = ''; currentLinks = []; searchInput.focus();
  });
  document.getElementById('openAllBtn').addEventListener('click', () => {
    currentLinks.forEach((url, i) => setTimeout(() => window.open(url, '_blank'), i * 120));
  });

  // --- History ---
  function saveToHistory(query, presetId, presetName) {
    let history = Store.getHistory();
    const entry = { query, presetId: presetId||'', presetName: presetName||'', date: new Date().toISOString() };
    history = history.filter(h => !(h.query === query && h.presetId === presetId));
    history.unshift(entry);
    history = history.slice(0, 30);
    Store.saveHistory(history);
  }
  function renderHistory() {
    const history = Store.getHistory();
    const list = document.getElementById('historyList');
    if (!history.length) { list.innerHTML = `<li class="no-history">${esc(M('noHistory'))}</li>`; return; }
    list.innerHTML = history.slice(0, 20).map(e => {
      const d = new Date(e.date);
      const ds = `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const presetLabel = e.presetName ? ` <span class="history-preset">${esc(e.presetName)}</span>` : '';
      return `<li class="history-item" data-query="${escA(e.query)}" data-preset="${escA(e.presetId||'')}"><span>${esc(e.query)}${presetLabel}</span><span class="history-date">${ds}</span></li>`;
    }).join('');
    list.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => doSearch(item.dataset.query, item.dataset.preset || undefined));
    });
  }
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm(M('confirmClearHistory'))) { Store.clearHistory(); renderHistory(); }
  });
  renderHistory();

  // --- Settings Page ---
  function renderSettings() {
    const all = getAllPresets();
    const builtins = all.filter(p => p.builtin);
    const customs = all.filter(p => !p.builtin);
    document.getElementById('builtinList').innerHTML = builtins.map(p => `
      <div class="preset-card"><div class="preset-card-header"><span class="preset-card-name">${esc(p.name)}</span><span class="preset-card-locale">${p.locale.toUpperCase()}</span></div>
      <div class="preset-card-searches">${p.searches.map(s=>esc(s.label)).join(', ')}</div></div>`).join('');
    const customList = document.getElementById('customList');
    if (!customs.length) {
      customList.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:10px 0;">${esc(M('noCustomPresets'))}</div>`;
    } else {
      customList.innerHTML = customs.map((p, i) => `
        <div class="preset-card custom"><div class="preset-card-header"><span class="preset-card-name">${esc(p.name)}</span><span class="preset-card-locale">${p.locale.toUpperCase()}</span></div>
        <div class="preset-card-searches">${p.searches.map(s=>esc(s.label)).join(', ')}</div>
        <div class="preset-actions"><button data-action="edit" data-idx="${i}">${esc(M('editBtn'))}</button><button class="delete" data-action="delete" data-idx="${i}">${esc(M('deleteBtn'))}</button></div></div>`).join('');
      customList.querySelectorAll('[data-action="edit"]').forEach(btn => btn.addEventListener('click', () => openEditor(parseInt(btn.dataset.idx))));
      customList.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', () => deleteCustomPreset(parseInt(btn.dataset.idx))));
    }
  }
  function deleteCustomPreset(i) {
    if (!confirm(M('confirmDeletePreset'))) return;
    const customs = Store.getCustomPresets(); customs.splice(i, 1);
    Store.saveCustomPresets(customs); renderSettings(); loadPresetSelect();
  }
  document.getElementById('addCustomBtn').addEventListener('click', () => openEditor(-1));

  // --- Edit Modal ---
  const editModal = document.getElementById('editModal');
  const editName = document.getElementById('editName');
  const editLocale = document.getElementById('editLocale');
  const searchEntries = document.getElementById('searchEntries');
  const jsonEditorEl = document.getElementById('jsonEditor');
  const jsonError = document.getElementById('jsonError');
  const searchCount = document.getElementById('searchCount');
  let editingIndex = -1, jsonMode = false;

  const SEARCH_ENGINES = [
    { value:'google', label:()=>M('engineGoogle'), base:'https://www.google.com/search?q=' },
    { value:'maps', label:()=>M('engineMaps'), base:'https://www.google.com/maps/search/' },
    { value:'youtube', label:()=>M('engineYoutube'), base:'https://www.youtube.com/results?search_query=' },
    { value:'custom', label:()=>M('engineCustom'), base:'' },
  ];

  function openEditor(index) {
    editingIndex = index; jsonMode = false;
    jsonEditorEl.classList.remove('show'); searchEntries.style.display = '';
    document.getElementById('addSearchEntry').style.display = '';
    document.getElementById('jsonToggle').textContent = M('jsonToggle');
    jsonError.style.display = 'none';
    if (index >= 0) {
      const customs = Store.getCustomPresets(); const p = customs[index];
      editName.value = p.name; editLocale.value = p.locale;
      renderSearchEntries(p.searches);
      document.getElementById('modalTitle').textContent = M('modalTitleEdit');
    } else {
      editName.value = ''; editLocale.value = 'ja';
      renderSearchEntries([{label:'Google',url:'https://www.google.com/search?q={query}',warning:false}]);
      document.getElementById('modalTitle').textContent = M('modalTitleNew');
    }
    editModal.classList.add('show');
  }
  function closeEditor() { editModal.classList.remove('show'); }
  document.getElementById('editCancel').addEventListener('click', closeEditor);
  editModal.addEventListener('click', e => { if (e.target === editModal) closeEditor(); });

  function renderSearchEntries(searches) {
    searchEntries.innerHTML = '';
    searches.forEach(s => {
      let engine = 'custom', queryTemplate = '';
      for (const eng of SEARCH_ENGINES) {
        if (eng.value === 'custom') continue;
        if (s.url.startsWith(eng.base)) { engine = eng.value; queryTemplate = decodeURIComponent(s.url.slice(eng.base.length)); break; }
      }
      if (engine === 'custom') queryTemplate = '';
      addSearchEntry({label:s.label, engine, queryTemplate, url:s.url, warning:s.warning});
    });
    updateSearchCount();
  }

  function addSearchEntry({label, engine, queryTemplate, url, warning}) {
    const div = document.createElement('div'); div.className = 'search-entry';
    const engineOptions = SEARCH_ENGINES.map(e => `<option value="${e.value}" ${e.value===engine?'selected':''}>${e.label()}</option>`).join('');
    div.innerHTML = `<button class="remove-entry" title="${escA(M('removeEntryTitle'))}">×</button>
      <div class="entry-row"><div class="entry-field"><label>${esc(M('serviceNameLabel'))}</label><input type="text" class="entry-label" value="${escA(label)}" placeholder="${escA(M('serviceNamePlaceholder'))}"></div>
      <div class="entry-field"><label>${esc(M('searchEngineLabel'))}</label><select class="entry-engine">${engineOptions}</select></div></div>
      <div class="entry-query-row" ${engine==='custom'?'style="display:none"':''}><label>${esc(M('queryLabel'))}</label><input type="text" class="entry-query" value="${escA(queryTemplate)}" placeholder="${escA(M('queryPlaceholder'))}"></div>
      <div class="entry-url-preview" title="${escA(M('urlEditTitle'))}">${esc(url||buildUrlFromEntry(engine,queryTemplate))}</div>
      <div class="entry-url-edit"><input type="text" class="entry-url-direct" value="${escA(url)}" placeholder="https://..."></div>
      <div class="entry-validation"></div>
      <div class="entry-options"><label><input type="checkbox" class="entry-warning" ${warning?'checked':''}> ${esc(M('warningFlag'))}</label></div>`;
    const engineSelect = div.querySelector('.entry-engine');
    const queryInput = div.querySelector('.entry-query');
    const queryRow = div.querySelector('.entry-query-row');
    const preview = div.querySelector('.entry-url-preview');
    const urlEditWrap = div.querySelector('.entry-url-edit');
    const urlDirect = div.querySelector('.entry-url-direct');
    const validation = div.querySelector('.entry-validation');
    function updatePreview() {
      const eng = engineSelect.value; const q = queryInput.value || '{query}';
      if (eng !== 'custom') { const u = buildUrlFromEntry(eng, q); preview.textContent = u; urlDirect.value = u; validation.style.display = 'none'; }
      const fUrl = urlDirect.value;
      if (fUrl && !fUrl.includes('{query}') && !fUrl.includes(encodeURIComponent('{query}'))) { validation.textContent = M('urlValidationWarning'); validation.style.display = 'block'; }
      else { validation.style.display = 'none'; }
    }
    engineSelect.addEventListener('change', () => {
      if (engineSelect.value === 'custom') { queryRow.style.display='none'; urlEditWrap.classList.add('show'); preview.style.display='none'; }
      else { queryRow.style.display=''; urlEditWrap.classList.remove('show'); preview.style.display=''; updatePreview(); }
    });
    queryInput.addEventListener('input', updatePreview);
    preview.addEventListener('click', () => { urlEditWrap.classList.toggle('show'); if (urlEditWrap.classList.contains('show')) urlDirect.focus(); });
    urlDirect.addEventListener('input', () => { preview.textContent = urlDirect.value; updatePreview(); });
    div.querySelector('.remove-entry').addEventListener('click', () => { div.remove(); updateSearchCount(); });
    searchEntries.appendChild(div); updateSearchCount();
  }

  function buildUrlFromEntry(engine, queryTemplate) {
    const eng = SEARCH_ENGINES.find(e => e.value === engine);
    if (!eng || !eng.base) return '';
    return eng.base + encodeURIComponent(queryTemplate).replace(/%7Bquery%7D/gi, '{query}');
  }
  function readFormEntries() {
    return Array.from(searchEntries.querySelectorAll('.search-entry')).map(div => {
      const engine = div.querySelector('.entry-engine').value;
      const query = div.querySelector('.entry-query').value.trim();
      let url;
      if (engine === 'custom' || div.querySelector('.entry-url-edit').classList.contains('show')) { url = div.querySelector('.entry-url-direct').value.trim(); }
      else { url = buildUrlFromEntry(engine, query || '{query}'); }
      return { label: div.querySelector('.entry-label').value.trim(), url, warning: div.querySelector('.entry-warning').checked };
    }).filter(e => e.label && e.url);
  }
  function updateSearchCount() { searchCount.textContent = M('searchCount', [String(searchEntries.children.length)]); }

  document.getElementById('addSearchEntry').addEventListener('click', () => {
    if (searchEntries.children.length >= 10) { alert(M('alertMaxSearchTargets')); return; }
    addSearchEntry({label:'', engine:'google', queryTemplate:'{query}', url:'', warning:false});
  });

  // JSON toggle
  document.getElementById('jsonToggle').addEventListener('click', () => {
    jsonMode = !jsonMode;
    document.getElementById('jsonToggle').textContent = jsonMode ? M('jsonToggleBack') : M('jsonToggle');
    if (jsonMode) {
      jsonEditorEl.classList.add('show'); searchEntries.style.display = 'none'; document.getElementById('addSearchEntry').style.display = 'none';
      jsonEditorEl.value = JSON.stringify(readFormEntries(), null, 2);
    } else {
      jsonEditorEl.classList.remove('show'); searchEntries.style.display = ''; document.getElementById('addSearchEntry').style.display = '';
      try { renderSearchEntries(JSON.parse(jsonEditorEl.value)); jsonError.style.display = 'none'; }
      catch (e) { jsonError.textContent = M('jsonErrorPrefix') + e.message; jsonError.style.display = 'block'; }
    }
  });

  // Save preset
  document.getElementById('editSave').addEventListener('click', () => {
    const name = editName.value.trim();
    if (!name) { editName.style.borderColor = 'var(--danger)'; return; }
    editName.style.borderColor = '';
    let searches;
    if (jsonMode) {
      try {
        searches = JSON.parse(jsonEditorEl.value);
        if (!Array.isArray(searches)) throw new Error(M('jsonErrorArray'));
        searches.forEach(s => { if (!s.label || !s.url) throw new Error(M('jsonErrorFields')); });
      } catch (e) { jsonError.textContent = M('jsonErrorPrefix') + e.message; jsonError.style.display = 'block'; return; }
    } else { searches = readFormEntries(); }
    if (!searches.length) { alert(M('alertAddOneSearch')); return; }
    if (searches.length > 10) { alert(M('alertMaxSearchTargets')); return; }
    const customs = Store.getCustomPresets();
    if (customs.length >= 10 && editingIndex < 0) { alert(M('alertMaxCustomPresets')); return; }
    const preset = { id: editingIndex >= 0 ? customs[editingIndex].id : 'custom-' + Date.now(), name, locale: editLocale.value, builtin: false, searches };
    if (editingIndex >= 0) customs[editingIndex] = preset; else customs.push(preset);
    Store.saveCustomPresets(customs);
    closeEditor(); renderSettings(); loadPresetSelect();
  });
});
  </script>
</body>
</html>
